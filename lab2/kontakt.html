<!doctype html>
<html lang="pl" data-theme="light">
    <head>
        <meta charset="UTF-8">
        <title>TechPunkt – Kontakt</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <script src="js/main.js" defer></script>
    </head>
    <body>
        <header class="kontener">
            <h1>Sklep z elektroniką</h1>
        </header>
        <button type="button" id="theme-toggle" aria-pressed="false" aria-label="Przełącz tryb ciemny"> 
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
        </button>
        <nav class="menu kontener">
            <a href="index.html">Strona Główna</a>
            <a href="kontakt.html" aria-current="page">Kontakt</a>
            <a href="produkt.html">Produkt</a>
        </nav>
        <main class="kontener">
            <p class="info-komunikat">
                Podgląd lokalny. Formularz nie wysyła wiadomości.
            </p>
            <form action="kontakt.html" method="get" id="formularz-kontakt">
                
                <div class="pole">
                    <label for="email">Adres email</label>
                    <input type="email" name="email" required id="email" placeholder="np. nazwa@cos.com">
                </div>
                
                <div class="pole">
                <label for="produkt">Wybierz produkt *</label>
                    <select name="produkt" required id="produkt">
                        <option value="">Wybierz produkt</option>
                        <option value="klawiatura">HyperX Alloy Origins 2 65</option>
                        <option value="sluchawki">Mad Dog GH800</option>
                        <option value="mysz">Razer DeathAdder Essential</option>
                    </select>
                </div>
                
                <div class="pole">
                    <label for="ilosc">Podaj ilość 1-5</label>
                    <input type="number" name="ilosc" required min="1" max="5" step="1" id="ilosc">
                </div>
                
                <div id="wycena" aria-live="polite"></div> 

                <div class="pole">
                    <label for="wiadomosc">Wyślij wiadomosc 10-500</label>
                    <textarea name="wiadomosc" required minlength="10" maxlength="500" id="wiadomosc" aria-describedby="error"></textarea>
                </div>
                
                <div id="error" hidden role="alert"></div>
                
                <div class="pole">
                    <button type="submit">Sprawdź zapytanie</button>
                </div>
            </form> 
            <div id="podsumowanie" hidden></div>
        </main>
        <footer class="kontener">
            <p>&copy; TechPunkt</p>
        </footer>

    </body>
</html>
